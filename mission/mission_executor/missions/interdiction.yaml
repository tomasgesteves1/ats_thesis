# Interdiction: the boat patrols while the UAV searches across its track; when the UAV detects the intruder (a boat
# in a forbidden zone, which flees when approached) the boat pursues it and the UAV stays above it, within the
# tether range, until the boat intercepts it; then the UAV lands back on the pad.
# Run with the intruder: ros2 launch mission_executor mission.launch.py mission:=interdiction intruder:=true
name: "Interdiction of an intruder"

uav:
  - {id: takeoff, type: takeoff, vertical_clearance: 1.5, clearance_duration: 5.0, pull_release_height: 1.6,
     offset: [0.0, 0.0, 3.0], duration: 6.0, tolerance: 0.3, arm_timeout: 30.0}
  - {id: search, type: search, ahead: 4.0, amplitude: 10.0, period: 20.0, height: 9.0, fov: 90.0,
     entry_duration: 6.0, timeout: 200.0}
  - {id: chase, type: chase, height: 9.0, max_horizontal: 10.5, entry_duration: 5.0, until: usv.intercept}
  - {id: land, type: land, height: 3.0, approach_duration: 10.0, tolerance: 0.15, velocity_tolerance: 0.15,
     settle: 3.0, track_timeout: 40.0, descent_duration: 12.0, final_height: 0.5, final_speed: 0.15,
     final_ramp: 1.0, depth: 0.2, touch_margin: 0.05, touch_velocity: 0.1, touch_time: 0.5, disarm_timeout: 5.0}

usv:
  - {id: wait, type: hold, duration: 0.0}
  - {id: patrol, type: waypoints, after: uav.takeoff, until: uav.search, points: [[45.0, 0.0], [45.0, 40.0]],
     speed: 1.0, ramp_time: 5.0, lookahead: 6.0, tolerance: 1.5}
  - {id: intercept, type: follow, after: uav.search, speed: 1.8, ramp_time: 4.0, intercept_distance: 10.0,
     standoff: 7.0, settle: 3.0}
  - {id: stop, type: hold, duration: 0.0}
