# Inspection of a tower in the water (radio tower at (-25, 0), base about 12 x 13 m, 44 m high) with the normal
# tether (d_max 15 m): the boat takes the UAV to the tower with the UAV in formation ahead of the bow; the UAV then
# circles the whole tower at a fixed height while the boat supports it from the water, keeping it within the reach
# of the tether, and the UAV lands back on the pad. The circle is given as a reference fixed in the world, entered
# almost at once: the NMPC plans the transfer to it. The boat keeps a standoff from the tower beyond the reach of the
# tether, so that its own tether constraint holds it at the reach of the UAV around the whole tower.
name: "Inspection"
description: "The USV takes the UAV to a tower, which the UAV circles while the USV supports it, then it lands."

uav:
  - {id: takeoff, type: takeoff, vertical_clearance: 1.5, clearance_duration: 5.0, pull_release_height: 1.6,
     offset: [0.0, 0.0, 3.0], duration: 6.0, tolerance: 0.3, arm_timeout: 30.0}
  - {id: formation, type: hold, boat_frame: 1, offset: [4.0, 0.0, 8.0], until: usv.route}
  - {id: orbit, type: inspect, center: [-25.0, 0.0], radius: 13.0, angle_start: 0.0, angle_end: 360.0,
     height_start: 12.0, height_end: 12.0, angular_speed: 0.06, ramp_time: 4.0, entry_duration: 1.0}
  - {id: land, type: land, height: 3.0, approach_duration: 10.0, tolerance: 0.15, velocity_tolerance: 0.15,
     settle: 3.0, track_timeout: 40.0, descent_duration: 12.0, final_height: 0.5, final_speed: 0.15,
     final_ramp: 1.0, depth: 0.2, touch_margin: 0.05, touch_velocity: 0.1, touch_time: 0.5, disarm_timeout: 5.0}

usv:
  - {id: wait, type: hold, duration: 0.0}
  - {id: route, type: waypoints, after: uav.takeoff, points: [[-6.0, 0.0]], step: 1, tolerance: 1.5}
  - {id: support, type: support, center: [-25.0, 0.0], standoff: 14.0, until: uav.orbit}
  - {id: stop, type: hold, duration: 0.0}
