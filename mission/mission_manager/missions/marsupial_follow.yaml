id: "marsupial_follow"
name: "Seguimento Marsupial"
description: "Drone segue o barco comandado por joystick mantendo offset vertical"
category: "cooperative"
icon: "link"

requires:
  simulation: "cooperative"
  tether: true
  vehicles: ["uav", "usv"]

simulation_launch:
  package: "mission_marsupial_follow"
  file: "sim.launch.py"
  args: {}

control_launch:
  package: "mission_marsupial_follow"
  file: "control.launch.py"
  args:
    predict_movement: "true"

user_params:
  - key: "altitude_offset"
    label: "Offset Vertical (acima do barco)"
    type: "float"
    default: 6.0
    min: 3.0
    max: 15.0
    unit: "m"
    ros_mapping:
      node: "uav_trajectory_boat_follower_node"
      param: "offset_z"

  - key: "predict_movement"
    label: "Prever movimento do barco"
    type: "bool"
    default: true
    ros_mapping:
      launch_arg: "predict_movement"
