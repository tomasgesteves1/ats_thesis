id: "test_uav_line"
name: "Test UAV Longitudinal Line"
description: "Drone MPC test on an inclined longitudinal line trajectory (3m to 10m altitude) at 2 and 3 m/s"
category: "test"
icon: "straight"

requires:
  simulation: "cooperative"
  tether: true
  vehicles: ["uav"]

simulation_launch:
  package: "test_uav_line"
  file: "sim.launch.py"
  args: {}

control_launch:
  package: "test_uav_line"
  file: "control.launch.py"
  args: {}

user_params:
  - key: "length"
    label: "Line Length"
    type: "float"
    default: 20.0
    min: 5.0
    max: 30.0
    unit: "m"
    ros_mapping:
      node: "uav_trajectory_line_node"
      param: "line_length"

  - key: "min_altitude"
    label: "Min Altitude"
    type: "float"
    default: 3.0
    min: 2.0
    max: 10.0
    unit: "m"
    ros_mapping:
      node: "uav_trajectory_line_node"
      param: "min_altitude"

  - key: "max_altitude"
    label: "Max Altitude"
    type: "float"
    default: 10.0
    min: 5.0
    max: 20.0
    unit: "m"
    ros_mapping:
      node: "uav_trajectory_line_node"
      param: "max_altitude"

  - key: "acceleration"
    label: "Acceleration"
    type: "float"
    default: 2.0
    min: 0.5
    max: 3.0
    unit: "m/s²"
    ros_mapping:
      node: "uav_trajectory_line_node"
      param: "acceleration"

  - key: "use_tether"
    label: "Enable Tether (MoorDyn)"
    type: "bool"
    default: true
    ros_mapping:
      launch_arg: "use_tether"
