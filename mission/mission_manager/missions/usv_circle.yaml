id: "usv_circle"
name: "Trajetória Circular USV"
description: "Teste MPC do barco numa trajetória circular"
category: "test"
icon: "circle"

requires:
  simulation: "cooperative"
  tether: false
  vehicles: ["usv"]

simulation_launch:
  package: "mission_usv_circle"
  file: "sim.launch.py"
  args: {}

control_launch:
  package: "mission_usv_circle"
  file: "control.launch.py"
  args: {}

user_params:
  - key: "radius"
    label: "Raio do Círculo"
    type: "float"
    default: 15.0
    min: 5.0
    max: 50.0
    unit: "m"
    ros_mapping:
      node: "usv_trajectory_circle_node"
      param: "circle_radius"

  - key: "omega"
    label: "Velocidade Angular"
    type: "float"
    default: 0.08
    min: 0.02
    max: 0.5
    unit: "rad/s"
    ros_mapping:
      node: "usv_trajectory_circle_node"
      param: "circle_omega"
