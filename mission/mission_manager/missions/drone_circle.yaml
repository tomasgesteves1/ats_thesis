id: "drone_circle"
name: "Trajetória Circular UAV"
description: "Teste MPC do drone numa trajetória circular a altitude constante"
category: "test"
icon: "circle"

requires:
  simulation: "cooperative"
  tether: true
  vehicles: ["uav"]

simulation_launch:
  package: "mission_drone_circle"
  file: "sim.launch.py"
  args: {}

control_launch:
  package: "mission_drone_circle"
  file: "control.launch.py"
  args: {}

user_params:
  - key: "radius"
    label: "Raio do Círculo"
    type: "float"
    default: 3.0
    min: 1.0
    max: 20.0
    unit: "m"
    ros_mapping:
      node: "uav_trajectory_circle_node"
      param: "circle_radius"

  - key: "altitude"
    label: "Altitude"
    type: "float"
    default: 7.0
    min: 3.0
    max: 25.0
    unit: "m"
    ros_mapping:
      node: "uav_trajectory_circle_node"
      param: "circle_height"

  - key: "speed"
    label: "Velocidade Angular"
    type: "float"
    default: 0.2
    min: 0.05
    max: 1.0
    unit: "rad/s"
    ros_mapping:
      node: "uav_trajectory_circle_node"
      param: "circle_omega"
