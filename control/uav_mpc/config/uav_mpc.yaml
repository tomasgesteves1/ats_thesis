uav_mpc_node:
  ros__parameters:
    # Open-loop test (captures first horizon in offboard and replays it)
    open_loop_test: false

    # Type of trajectory to follow: "hold" or "circle"
    trajectory_type: "circle"

    # Enable/Disable physical model and constraints of the tether
    use_tether: false

    # Circular trajectory parameters
    circle_radius: 3.0
    circle_omega: 0.2
    circle_height: 10.0

    # Hold mode height
    hold_height: 7.0     # Target hovering altitude in hold mode (m)

    # Takeoff height (used by PX4 takeoff command and state machine checks)
    takeoff_height: 4.0


    # Dynamic physical limits of the drone (less aggressive settings)
    v_max: 10.0          # Maximum velocity (m/s)
    u_max: 16.0          # Maximum thrust acceleration (m/s^2)
    hover_throttle: 0.618 # Normalized hover throttle command
    tilt_max: 0.5        # Maximum tilt angle (rad, ~28.6 deg)

    # Cost weights (adjustable dynamically)
    weight_position: 20.0  # Weight for X, Y, Z position error
    weight_velocity: 5.0   # Weight for Vx, Vy, Vz velocity error
